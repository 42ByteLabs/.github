name: Auto Patch Release

on:
  workflow_call:
    inputs:
      mode:
        description: "Auto-release mode"
        required: false
        type: string
        default: minor

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: Get Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@cb731e00cb6754f584507134ff389dfb3dc42bbc    # v5.1.0
        with:
          application_id: ${{ secrets.BYTELABS_APP_ID }}
          application_private_key: ${{ secrets.BYTELABS_APP_KEY }}

      - name: "Patch Release Me"
        uses: 42ByteLabs/patch-release-me@0.6.6
        with:
          mode: ${{ inputs.mode }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1    # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          title: "Chore - Auto Patch Update Release"
          commit-message: "[chore]: Auto Patch Release"
          body: |
            This is automatically created as a chore to patch and update the release.
          branch: "auto-patch-release"
          labels: "version"
          delete-branch: true
